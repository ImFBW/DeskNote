<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskNote 后台</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="login" class="login">
    <form id="login-form" class="panel">
      <div class="mark">DN</div>
      <h1>DeskNote 后台</h1>
      <p>管理同步用户、便签和运行日志。桌面端不登录也能本地使用。</p>
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
  <div id="shell" class="shell hidden">
    <aside>
      <div class="mark">DN</div>
      <button type="button" data-page="overview" class="active">概览</button>
      <button type="button" data-page="users">用户</button>
      <button type="button" data-page="notes">便签</button>
      <button type="button" data-page="reminders">提醒</button>
      <button type="button" data-page="logs">日志</button>
      <button type="button" data-page="account">账号</button>
      <button type="button" id="logout">退出</button>
    </aside>
    <main id="main"></main>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
